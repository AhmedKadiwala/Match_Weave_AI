[project]
name = "matchweave-ai"
version = "1.0.0"
description = "Evidence-first synthetic football intelligence"
requires-python = ">=3.11"
dependencies = ["agent-framework-core==1.22.0", "agent-framework-openai==1.17.0", "fastapi==0.143.2", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
